name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-bot:
    name: Validate bot
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ' '), 'app/') || contains(join(github.event.head_commit.added, ' '), 'app/') || contains(join(github.event.head_commit.modified, ' '), 'bot.py') || contains(join(github.event.head_commit.added, ' '), 'bot.py') || contains(join(github.event.head_commit.modified, ' '), 'requirements.txt') || contains(join(github.event.head_commit.added, ' '), 'requirements.txt') || contains(join(github.event.head_commit.modified, ' '), 'tests/') || contains(join(github.event.head_commit.added, ' '), 'tests/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q app bot.py
      - name: Run tests
        run: python -m pytest -q

  validate-marketplace:
    name: Validate marketplace
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ' '), 'marketplace/') || contains(join(github.event.head_commit.added, ' '), 'marketplace/') }}
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [validate-bot, validate-marketplace]
    if: >-
      ${{
        always() &&
        (needs.validate-bot.result == 'success' || needs.validate-bot.result == 'skipped') &&
        (needs.validate-marketplace.result == 'success' || needs.validate-marketplace.result == 'skipped')
      }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          {
            echo "bot=false"
            echo "marketplace=false"
          } >> "$GITHUB_OUTPUT"
          if echo "$changed" | grep -Eq '^(app/|bot\.py$|requirements\.txt$|tests/)'; then
            sed -i 's/^bot=false/bot=true/' "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq '^marketplace/'; then
            sed -i 's/^marketplace=false/marketplace=true/' "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.changes.outputs.bot == 'true' || steps.changes.outputs.marketplace == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          key="$VPS_SSH_KEY"
          if ! printf '%s' "$key" | grep -q -- 'BEGIN .* PRIVATE KEY'; then
            key="$(printf '%s' "$key" | base64 --decode 2>/dev/null || true)"
          fi
          if ! printf '%s' "$key" | tr -d '\r' | grep -q -- 'BEGIN .* PRIVATE KEY'; then
            echo 'VPS_SSH_KEY não contém uma chave privada OpenSSH válida.' >&2
            exit 1
          fi
          printf '%s\n' "$key" | tr -d '\r' | ssh-add -
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Deploy changed services
        if: steps.changes.outputs.bot == 'true' || steps.changes.outputs.marketplace == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_BOT: ${{ steps.changes.outputs.bot }}
          DEPLOY_MARKETPLACE: ${{ steps.changes.outputs.marketplace }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "DEPLOY_BOT='$DEPLOY_BOT' DEPLOY_MARKETPLACE='$DEPLOY_MARKETPLACE' bash -s" <<'REMOTE'
          set -euo pipefail
          if [[ "$DEPLOY_BOT" == "true" ]]; then
            BOT_DEPLOY_DIR=/var/www/bot-deploy
            BOT_RUNTIME_DIR=/var/lib/drakoria-bot
            if [[ ! -d "$BOT_DEPLOY_DIR/.git" ]]; then
              git clone --branch main --single-branch https://github.com/Cropgem45/BOT-Drakoria.git "$BOT_DEPLOY_DIR"
            fi
            mkdir -p "$BOT_RUNTIME_DIR/data" "$BOT_RUNTIME_DIR/logs"
            if [[ -f /var/www/bot/data/drakoria.sqlite3 && ! -f "$BOT_RUNTIME_DIR/data/drakoria.sqlite3" ]]; then
              cp -a /var/www/bot/data/. "$BOT_RUNTIME_DIR/data/"
            fi
            if [[ ! -f "$BOT_DEPLOY_DIR/.env" && -f /var/www/bot/.env ]]; then
              cp /var/www/bot/.env "$BOT_DEPLOY_DIR/.env"
            fi
            if grep -q '^DATABASE_PATH=' "$BOT_DEPLOY_DIR/.env"; then
              sed -i "s|^DATABASE_PATH=.*|DATABASE_PATH=$BOT_RUNTIME_DIR/data/drakoria.sqlite3|" "$BOT_DEPLOY_DIR/.env"
            else
              printf '\nDATABASE_PATH=%s\n' "$BOT_RUNTIME_DIR/data/drakoria.sqlite3" >> "$BOT_DEPLOY_DIR/.env"
            fi
            cd "$BOT_DEPLOY_DIR"
            git fetch origin main
            git pull --ff-only origin main
            if [[ ! -x .venv/bin/pip ]]; then python3 -m venv .venv; fi
            .venv/bin/pip install -r requirements.txt
            cat >/etc/systemd/system/drakoria-bot.service <<'SERVICE'
            [Unit]
            Description=Bot Drakoria (Discord) - /var/www/bot-deploy
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=root
            Group=root
            WorkingDirectory=/var/www/bot-deploy
            Environment=PYTHONUNBUFFERED=1
            EnvironmentFile=/var/www/bot-deploy/.env
            ExecStart=/var/www/bot-deploy/.venv/bin/python bot.py
            Restart=always
            RestartSec=5
            NoNewPrivileges=true
            PrivateTmp=true
            ProtectSystem=full
            ProtectHome=true
            ReadWritePaths=/var/www/bot-deploy /var/lib/drakoria-bot
            StandardOutput=append:/var/lib/drakoria-bot/logs/bot.out.log
            StandardError=append:/var/lib/drakoria-bot/logs/bot.err.log

            [Install]
            WantedBy=multi-user.target
          SERVICE
            systemctl daemon-reload
            systemctl restart drakoria-bot.service
            systemctl is-active --quiet drakoria-bot.service
          fi
          if [[ "$DEPLOY_MARKETPLACE" == "true" ]]; then
            cd /var/www/site
            git fetch origin main
            git pull --ff-only origin main
            npm ci --omit=dev
            pm2 restart drakoria-site
            pm2 describe drakoria-site | grep -q online
          fi
          REMOTE
